[package]
name = "winch-mcp"
version = "0.2.0"
edition = "2021"
description = "Windows computer-use MCP server: drives real apps through the UI Automation tree instead of guessing pixels"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wwwzzzxxx/winch-opencode-computer-use-mcp"
readme = "README.md"
keywords = ["mcp", "computer-use", "windows", "uia", "automation"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "winch-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
